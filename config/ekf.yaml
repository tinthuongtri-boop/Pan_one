ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    #TF frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    #Cấu hình odometry
    odom0: /diff_cont/odom
    #cấu hình mảng ma trận:
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    #cấu hình IMU
    imu0: /imu/data
    #mảng ma trận IMU
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]

    imu0_remove_gravitational_acceleration: true